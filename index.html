<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExplorerApp - Inicio</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-surface-color-background font-lato text-texto-secondary min-h-screen flex flex-col justify-between">

  <!-- ENCABEZADO Y NAVEGACION -->
  <header class="bg-brand-secondary text-texto-invert p-lg py-5 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 md:gap-8 px-4">
      <span class="font-roboto font-black text-sm md:text-base tracking-wide uppercase">
        Scan. Guess. Master the world.
      </span>

      <a href="/index.html" class="flex items-center justify-center">
        <img src="/src/assets/Mosaico.svg" alt="Explorer App Logo" class="w-9 h-9 object-contain" />
      </a>

      <!-- Navegacion con indicador activo -->
      <nav class="flex items-center gap-6 text-sm font-medium">
        <a href="/index.html" aria-current="page"
          class="flex items-center gap-2 px-3 py-1.5 rounded-rd-sm border-b-2 border-brand-accent text-brand-accent font-bold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent">
          <img src="/src/assets/home.svg" alt="" class="w-5 h-5" />
          <span>Inicio</span>
        </a>
        <a href="/Busqueda.html"
          class="flex items-center gap-2 px-3 py-1.5 rounded-rd-sm hover:text-brand-accent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent">
          <img src="/src/assets/Mosaico.svg" alt="" class="w-5 h-5" />
          <span>Mosaic de paises</span>
        </a>
        <a href="/Respuesta.html"
          class="flex items-center gap-2 px-3 py-1.5 rounded-rd-sm hover:text-brand-accent transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-accent">
          <img src="/src/assets/acerca de.svg" alt="" class="w-5 h-5" />
          <span>Acerca de</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="w-full max-w-7xl mx-auto px-4 py-8 flex-1 flex flex-col">

    <!-- SECCION BUSCADOR PRINCIPAL -->
    <section class="bg-surface-background rounded-rd-lg p-6 md:p-8 mb-10 shadow-sm border border-brand-primary">
      <div class="flex flex-col items-center text-center gap-8 max-w-3xl mx-auto w-full">
        <div>
          <h1
            class="font-roboto font-black text-2xl md:text-3xl leading-tight text-surface-icon-color tracking-tight uppercase">
            EXPLORAR PAISES<br />DEL MUNDO
          </h1>
          <p class="font-roboto font-bold text-base md:text-lg mt-1 text-texto-secondary">
            Aprende lo mas importante
          </p>
        </div>

        <form action="/Busqueda.html" method="GET" class="w-full flex flex-col gap-4">
          <div class="relative w-full">
            <img src="/src/assets/Buscar.svg" alt="" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2" />
            <input type="text" name="query" placeholder="Escriba nombre del país..."
              class="w-full h-12 pl-12 pr-4 border-2 border-brand-accent rounded-rd-sm font-roboto text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-secondary text-surface-icon-color bg-surface-background shadow-inner" />
          </div>

          <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
            <button type="button" disabled
              class="bg-brand-button-estado-desabilitado text-texto-secondary font-roboto font-bold px-6 h-11 rounded-rd-sm text-xs cursor-not-allowed opacity-70">
              REGRESAR
            </button>

            <div class="relative flex-1">
              <img src="/src/assets/Filtro.svg" alt="" aria-hidden="true"
                class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" />
              <select id="region-filter" name="region-filter" aria-label="Filtrar países por región"
                class="w-full h-11 pl-9 pr-8 border border-brand-accent rounded-rd-sm font-roboto text-xs focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-secondary text-surface-icon-color bg-surface-background cursor-pointer">
                <option value="">Todas las regiones</option>
                <option value="Africa">África</option>
                <option value="Americas">América</option>
                <option value="Asia">Asia</option>
                <option value="Europe">Europa</option>
                <option value="Oceania">Oceanía</option>
              </select>
            </div>



            <button type="submit"
              class="bg-brand-button-default hover:bg-brand-button-hover active:scale-95 text-surface-icon-color font-roboto font-bold px-8 h-11 rounded-rd-sm text-xs transition-all shadow-sm cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-secondary inline-flex items-center justify-center uppercase">
              BUSCAR
            </button>
          </div>
        </form>


        
      </div>
    </section>

    <!-- SECCION PAISES RECOMENDADOS -->
    <!-- <section class="mb-12">
      <h2 class="max-w-5xl mx-auto font-roboto font-black text-xl mb-6 tracking-wide text-texto-secondary uppercase text-center sm:text-left">
        PAÍSES RECOMENDADOS
      </h2>
-->


    <!-- MODULO 2 -->
<!-- MODULO 2 -->
<section class="mb-12">

  <h2
    class="max-w-5xl mx-auto font-roboto font-black text-xl mb-6 tracking-wide text-texto-secondary uppercase text-center sm:text-left">
    Países Recomendados
  </h2>

  <section
    id="country-container"
    aria-label="Listado de países recomendados"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto justify-items-center">
  </section>

</section>



  </main>

  <!-- PIE DE PAGINA -->
  <footer class="bg-brand-secondary text-texto-invert border-t-4 border-brand-accent px-6 py-6 mt-auto">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-sm">
      <div class="flex flex-col gap-1 items-center md:items-start">
        <a href="/index.html" class="hover:underline focus-visible:ring-2 focus-visible:ring-brand-accent">Explorer
          App</a>
        <a href="#" class="hover:underline focus-visible:ring-2 focus-visible:ring-brand-accent">Redes Sociales</a>
      </div>
      <img src="/src/assets/Mosaico.svg" alt="Logo Footer" class="w-8 h-8 object-contain" />
      <div class="flex flex-col gap-1 items-center md:items-end">
        <a href="/Respuesta.html" class="hover:underline focus-visible:ring-2 focus-visible:ring-brand-accent">Más
          información</a>
      </div>
    </div>
  </footer>


  <script type="module" src="/src/main.ts"></script>
</body>

</html>
